name: CI

on:
  pull_request:
  push:
    branches: [develop, stage, main]

jobs:
  checks:
    runs-on: ubuntu-latest

    # The tests need a database. GitHub starts this container alongside the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uk_backend
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/uk_backend

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest

  # Deploys the dev site. Render's own auto-deploy is turned off so that this job, which only
  # runs once `checks` has passed, is the single way a merge reaches the deployed site.
  deploy-dev:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy
        # The hook URL carries its own key, so it is the whole secret.
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
