{% comment %}
    Call-to-action button plus a copyable fallback link, included by several emails.
    Expects "url" and "label" in the context.
{% endcomment %}
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="margin:0 0 28px 0;">
  <tr>
    <td align="center">
      <a href="{{ url }}"
         style="display:inline-block; background-color:#2563eb; color:#ffffff; font-size:15px;
                font-weight:bold; padding:14px 32px; border-radius:6px; text-decoration:none;">
        {{ label }}
      </a>
    </td>
  </tr>
</table>

<p style="margin:0 0 8px 0; font-size:13px; color:#888888;">
  If the button does not work, copy this link into your browser:
</p>
<p style="margin:0 0 28px 0; font-size:13px; word-break:break-all;">
  <a href="{{ url }}" style="color:#2563eb;">{{ url }}</a>
</p>
